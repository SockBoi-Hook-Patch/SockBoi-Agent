[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sockboi-agent"
version = "0.3.1"
description = "Modular AI agent, security skills, and policy-gated MCP foundation for authorized security assessments"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["ai-agent", "cybersecurity", "security-assessment", "fastapi", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/SockBoi-Hook-Patch/SockBoi-Agent"
Repository = "https://github.com/SockBoi-Hook-Patch/SockBoi-Agent"
Issues = "https://github.com/SockBoi-Hook-Patch/SockBoi-Agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["sockboi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
